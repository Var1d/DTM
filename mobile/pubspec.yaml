name: daily_task_manager
description: Aplikasi manajemen tugas harian multiplatform - Tugas Besar PABP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.1
  # HTTP client
  http: ^1.2.0
  # Local storage (token, user data)
  shared_preferences: ^2.2.2
  # Local notification & reminder (platform-specific feature #1)
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  # Biometric auth (platform-specific feature #2)
  local_auth: ^2.1.8
  # Date picker
  intl: ^0.19.0
  # Color picker untuk kategori
  flutter_colorpicker: ^1.0.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
