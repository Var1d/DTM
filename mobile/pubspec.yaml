name: daily_task_manager
description: Aplikasi manajemen tugas harian multiplatform - Tugas Besar PABP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.1
  # HTTP client
  http: ^1.2.0
  # Local storage (token, user data)
  shared_preferences: ^2.2.2
  # Local notification & reminder (platform-specific feature #1)
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  # Biometric auth (platform-specific feature #2)
  local_auth: ^2.1.8
  # Date picker
  intl: ^0.19.0
  image_picker: ^1.2.2
  shimmer: ^3.0.0
  image_cropper: ^12.2.1
  table_calendar: ^3.1.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon-app.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon-app.png"

flutter_native_splash:
  color: "#F1EEF9"
  color_dark: "#090913"
  image: "assets/images/pio-logo.png"
  android_12:
    image: "assets/images/icon-app.png"
    icon_backgroundColor: "#FFFFFF"
    icon_backgroundColor_dark: "#090913"
